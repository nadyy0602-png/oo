    // =========================================================================
    // 2. حالة التطبيق وحفظ/استعادة البيانات من localStorage
    // =========================================================================
    let state = {
      activeTab: 'workers',
      searchQuery: '',
      secondaryFilter: 'ALL',
      data: createInitialData()
    };

    function saveStateToStorage() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state.data));
      } catch (err) {
        console.error('خطأ أثناء حفظ البيانات:', err);
        showToast('تعذر حفظ البيانات في التخزين المحلي', 'error');
      }
    }

    function loadStateFromStorage() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) {
          state.data = createInitialData();
          saveStateToStorage();
          return;
        }
        const parsed = JSON.parse(raw);
        const defaults = createInitialData();
        state.data = {
          farmInfo: { ...defaults.farmInfo, ...(parsed.farmInfo || {}) },
          workers: Array.isArray(parsed.workers) ? parsed.workers : defaults.workers,
          expenses: Array.isArray(parsed.expenses) ? parsed.expenses : defaults.expenses,
          clients: Array.isArray(parsed.clients) ? parsed.clients : defaults.clients,
          sales: Array.isArray(parsed.sales) ? parsed.sales : defaults.sales,
          varieties: Array.isArray(parsed.varieties) ? parsed.varieties : defaults.varieties,
          operations: Array.isArray(parsed.operations) ? parsed.operations : defaults.operations
        };
      } catch (err) {
        console.error('خطأ في قراءة البيانات المخزنة:', err);
        state.data = createInitialData();
      }
    }

    // =========================================================================
    // 3. دوال الحسابات المالية والتشغيلية الموحدة
    // =========================================================================
    function getCurrency() {
      return state.data.farmInfo.currency || 'ج.م';
    }

    function formatMoney(num) {
      const val = Number(num) || 0;
      return `${val.toLocaleString('ar-EG', { maximumFractionDigits: 2 })} ${getCurrency()}`;
    }

    function formatNumber(num) {
      return (Number(num) || 0).toLocaleString('ar-EG', { maximumFractionDigits: 2 });
    }

    // حساب صافي راتب العامل بدقة
    function calculateWorkerNetSalary(worker) {
      const base = Number(worker.baseSalary) || 0;
      const present = Number(worker.presentDays) || 0;
      const absent = Number(worker.absentDays) || 0;
      const advances = Number(worker.advances) || 0;
      const deductions = Number(worker.deductions) || 0;

      // خصم أيام الغياب بناءً على شهر عمل 30 يوماً إذا وُجدت أيام غياب
      const dailyRate = base / 30;
      const absenceDeduction = absent > 0 ? dailyRate * absent : 0;
      const net = base - absenceDeduction - advances - deductions;
      return {
        dailyRate,
        absenceDeduction,
        net: Math.round(net * 100) / 100
      };
    }

    function getTotalWorkersNetSalaries() {
      return state.data.workers.reduce((sum, w) => sum + calculateWorkerNetSalary(w).net, 0);
    }

    function getTotalDirectExpenses() {
      return state.data.expenses.reduce((sum, e) => sum + (Number(e.amount) || 0), 0);
    }

    // إجمالي المصروفات شامل صافي رواتب العمال
    function getTotalExpensesIncludingSalaries(includeSalaries = true) {
      const direct = getTotalDirectExpenses();
      return includeSalaries ? direct + getTotalWorkersNetSalaries() : direct;
    }

    // حساب إجمالي الفاتورة والمتبقي لكل عملية بيع
    function getSaleInvoiceTotal(sale) {
      return (Number(sale.quantity) || 0) * (Number(sale.unitPrice) || 0);
    }

    function getTotalSalesRevenue() {
      return state.data.sales.reduce((sum, s) => sum + getSaleInvoiceTotal(s), 0);
    }

    function getTotalSalesCollected() {
      return state.data.sales.reduce((sum, s) => sum + (Number(s.paidAmount) || 0), 0);
    }

    // حساب مشتريات ومدفوعات ومتبقي كل عميل بناءً على المبيعات والدفعات المسجلة
    function getClientFinancials(client) {
      const clientSales = state.data.sales.filter(s => s.clientId === client.id);
      const purchasesTotal = clientSales.reduce((sum, s) => sum + getSaleInvoiceTotal(s), 0);
      const collectedFromSales = clientSales.reduce((sum, s) => sum + (Number(s.paidAmount) || 0), 0);
      const extraPayments = Number(client.paymentsReceived) || 0;

      // نعتمد أعلى قيمة بين المدفوعات المسجلة على الفواتير أو إجمالي المدفوعات المحدثة للعميل
      // مع ضمان مزامنة سلسة عند إضافة فاتورة أو تسجيل دفعة للعميل
      const totalPaid = Math.max(collectedFromSales, extraPayments);
      const remainingDebt = Math.max(0, purchasesTotal - totalPaid);

      return {
        purchasesTotal,
        totalPaid,
        remainingDebt,
        invoicesCount: clientSales.length
      };
    }

    function getTotalClientDebts() {
      return state.data.clients.reduce((sum, c) => sum + getClientFinancials(c).remainingDebt, 0);
    }

    function getTotalPalmsCount() {
      const varietiesSum = state.data.varieties.reduce((sum, v) => sum + (Number(v.palmCount) || 0), 0);
      return varietiesSum > 0 ? varietiesSum : (Number(state.data.farmInfo.totalPalms) || 0);
    }

    function getTotalYieldKg() {
      return state.data.varieties.reduce((sum, v) => sum + (Number(v.yieldKg) || 0), 0);
    }

    function showToast(message, type = 'success') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      const styles = type === 'error'
        ? 'bg-rose-700 text-white border-rose-800'
        : type === 'warning'
        ? 'bg-amber-600 text-white border-amber-700'
        : 'bg-palm-800 text-white border-palm-900';

      toast.className = `px-4 py-3 rounded-xl border shadow-lg text-sm font-bold flex items-center gap-2 transition-all duration-300 pointer-events-auto ${styles}`;
      toast.innerHTML = `<span>${escapeHtml(message)}</span>`;
      container.appendChild(toast);

      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(10px)';
        setTimeout(() => toast.remove(), 300);
      }, 2800);
    }

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');

    function recalcModalWorkerNet() {
      const base = Number(document.getElementById('w_baseSalary')?.value) || 0;
      const present = Number(document.getElementById('w_presentDays')?.value) || 0;
      const absent = Number(document.getElementById('w_absentDays')?.value) || 0;
      const advances = Number(document.getElementById('w_advances')?.value) || 0;
      const deductions = Number(document.getElementById('w_deductions')?.value) || 0;

      const calc = calculateWorkerNetSalary({ baseSalary: base, presentDays: present, absentDays: absent, advances, deductions });
      const previewEl = document.getElementById('w_netPreview');
      const breakdownEl = document.getElementById('w_calcBreakdown');
      if (previewEl) previewEl.textContent = formatMoney(calc.net);
      if (breakdownEl) {
        breakdownEl.textContent = `خصم غياب (${absent} يوم): ${formatMoney(calc.absenceDeduction)} • سلف: ${formatMoney(advances)} • خصومات: ${formatMoney(deductions)}`;
      }
    }

    function saveWorkerForm(e) {
      e.preventDefault();
      const id = document.getElementById('w_id').value || `w-${Date.now()}`;
      const record = {
        id,
        name: document.getElementById('w_name').value.trim(),
        phone: document.getElementById('w_phone').value.trim(),
        role: document.getElementById('w_role').value.trim(),
        baseSalary: Math.max(0, Number(document.getElementById('w_baseSalary').value) || 0),
        presentDays: Math.max(0, Number(document.getElementById('w_presentDays').value) || 0),
        absentDays: Math.max(0, Number(document.getElementById('w_absentDays').value) || 0),
        advances: Math.max(0, Number(document.getElementById('w_advances').value) || 0),
        deductions: Math.max(0, Number(document.getElementById('w_deductions').value) || 0)
      };

      const idx = state.data.workers.findIndex(w => w.id === id);
      if (idx >= 0) {
        state.data.workers[idx] = record;
        showToast('تم تحديث بيانات العامل بنجاح');
      } else {
        state.data.workers.unshift(record);
        showToast('تمت إضافة العامل بنجاح');
      }

      saveStateToStorage();
      closeModal();
      renderCurrentModule();
      updateGlobalSummaryBadges();
    }

    function deleteWorker(id) {
      state.data.workers = state.data.workers.filter(w => w.id !== id);
      saveStateToStorage();
      renderCurrentModule();
      updateGlobalSummaryBadges();
      showToast('تم حذف سجل العامل', 'warning');
    }

      e.preventDefault();
      const id = document.getElementById('e_id').value || `e-${Date.now()}`;
      const record = {
        id,
        category: document.getElementById('e_category').value,
        amount: Math.max(0, Number(document.getElementById('e_amount').value) || 0),
        date: document.getElementById('e_date').value,
        notes: document.getElementById('e_notes').value.trim()

      const idx = state.data.expenses.findIndex(item => item.id === id);
      if (idx >= 0) {
        state.data.expenses[idx] = record;

      } else {
        state.data.expenses.unshift(record);

      saveStateToStorage();
      closeModal();
      renderCurrentModule();
      updateGlobalSummaryBadges();
    }

    function saveClientForm(e) {
      e.preventDefault();
      const id = document.getElementById('c_id').value || `c-${Date.now()}`;
      const record = {
        id,
        name: document.getElementById('c_name').value.trim(),
        phone: document.getElementById('c_phone').value.trim(),
        address: document.getElementById('c_address').value.trim(),
        type: document.getElementById('c_type').value.trim() || 'عميل',
        paymentsReceived: Math.max(0, Number(document.getElementById('c_paymentsReceived').value) || 0),
        notes: document.getElementById('c_notes').value.trim()
      };

      const idx = state.data.clients.findIndex(c => c.id === id);
      if (idx >= 0) {
        state.data.clients[idx] = record;
        showToast('تم تحديث بيانات العميل');
      } else {
        state.data.clients.unshift(record);
        showToast('تمت إضافة العميل بنجاح');
      }

      saveStateToStorage();
      closeModal();
      renderCurrentModule();
    }

    function openCollectPaymentModal(clientId) {
      const client = state.data.clients.find(c => c.id === clientId);
      if (!client) return;
      const fin = getClientFinancials(client);

      openModal(`تحصيل دفعة من: ${client.name}`, `
        <form onsubmit="saveClientPayment(event, '${client.id}')" class="space-y-4">
          <div class="p-3.5 rounded-xl bg-amber-50 border border-amber-200 text-xs font-bold text-amber-900 flex justify-between">

          <div>
            <label class="block text-xs font-bold text-stone-700 mb-1">قيمة الدفعة المستلمة (${getCurrency()}) *</label>
            <input type="number" id="pay_amount" required min="0.01" max="${fin.remainingDebt}" step="0.01" value="${fin.remainingDebt}"
              class="w-full px-3.5 py-2.5 rounded-xl border border-stone-300 focus:border-palm-500 focus:outline-none text-sm" />
          </div>
          <div class="flex items-center justify-end gap-2 pt-2">
            <button type="button" onclick="closeModal()" class="px-4 py-2.5 rounded-xl text-sm font-bold bg-stone-100 hover:bg-stone-200 text-stone-700 cursor-pointer">إلغاء</button>
            <button type="submit" class="px-5 py-2.5 rounded-xl text-sm font-bold bg-emerald-600 hover:bg-emerald-700 text-white cursor-pointer">تأكيد التحصيل</button>
          </div>
        </form>
      `);
    }

    function saveClientPayment(e, clientId) {
      e.preventDefault();
      const amount = Math.max(0, Number(document.getElementById('pay_amount').value) || 0);
      const client = state.data.clients.find(c => c.id === clientId);
      if (!client || amount <= 0) return;

      const fin = getClientFinancials(client);
      client.paymentsReceived = fin.totalPaid + amount;

      // توزيع الدفعة على فواتير العميل غير المكتملة التحصيل لتبقى الفواتير متزامنة
      let remainingToApply = amount;
      state.data.sales
        .filter(s => s.clientId === clientId)
        .forEach(sale => {
          if (remainingToApply <= 0) return;
          const invTotal = getSaleInvoiceTotal(sale);
          const paid = Number(sale.paidAmount) || 0;
          const due = Math.max(0, invTotal - paid);
          if (due > 0) {
            const add = Math.min(due, remainingToApply);
            sale.paidAmount = paid + add;
            remainingToApply -= add;
          }
        });

      saveStateToStorage();
      closeModal();
      renderCurrentModule();
      updateGlobalSummaryBadges();
      showToast(`تم تسجيل تحصيل ${formatMoney(amount)} بنجاح`);
    }

    function deleteClient(id) {
      state.data.clients = state.data.clients.filter(c => c.id !== id);
      saveStateToStorage();
      renderCurrentModule();
      showToast('تم حذف العميل', 'warning');
    }

    function recalcModalSale() {
      const qty = Number(document.getElementById('s_quantity')?.value) || 0;
      const price = Number(document.getElementById('s_unitPrice')?.value) || 0;
      const paid = Number(document.getElementById('s_paidAmount')?.value) || 0;
      const total = qty * price;
      const rem = Math.max(0, total - paid);

      const totEl = document.getElementById('s_totalPreview');
      const remEl = document.getElementById('s_remPreview');
      if (totEl) totEl.textContent = formatMoney(total);
      if (remEl) remEl.textContent = formatMoney(rem);
    }

    function saveSaleForm(e) {
      e.preventDefault();
      const id = document.getElementById('s_id').value || `s-${Date.now()}`;
      const record = {
        id,
        clientId: document.getElementById('s_clientId').value,
        variety: document.getElementById('s_variety').value,
        quantity: Math.max(0, Number(document.getElementById('s_quantity').value) || 0),
        unit: 'كجم',
        unitPrice: Math.max(0, Number(document.getElementById('s_unitPrice').value) || 0),
        paidAmount: Math.max(0, Number(document.getElementById('s_paidAmount').value) || 0),
        date: document.getElementById('s_date').value,
        notes: document.getElementById('s_notes').value.trim()
      };

      const idx = state.data.sales.findIndex(s => s.id === id);
      if (idx >= 0) {
        state.data.sales[idx] = record;
        showToast('تم تحديث فاتورة المبيعات');
      } else {
        state.data.sales.unshift(record);
        showToast('تمت إضافة فاتورة المبيعات بنجاح');
      }

      saveStateToStorage();
      closeModal();
      renderCurrentModule();
      updateGlobalSummaryBadges();
    }

    function deleteSale(id) {
      state.data.sales = state.data.sales.filter(s => s.id !== id);
      saveStateToStorage();
      renderCurrentModule();
      updateGlobalSummaryBadges();
      showToast('تم حذف فاتورة المبيعات', 'warning');
    }

    function saveVarietyForm(e) {
      e.preventDefault();
      const id = document.getElementById('v_id').value || `v-${Date.now()}`;
      const record = {
        id,
        name: document.getElementById('v_name').value.trim(),
        palmCount: Math.max(0, Number(document.getElementById('v_palmCount').value) || 0),
        yieldKg: Math.max(0, Number(document.getElementById('v_yieldKg').value) || 0),
        avgAgeYears: Math.max(0, Number(document.getElementById('v_avgAgeYears').value) || 0),
        notes: document.getElementById('v_notes').value.trim()
      };

      const idx = state.data.varieties.findIndex(v => v.id === id);
      if (idx >= 0) {
        state.data.varieties[idx] = record;
        showToast('تم تحديث صنف النخيل');
      } else {
        state.data.varieties.push(record);
        showToast('تمت إضافة صنف النخيل بنجاح');
      }

      state.data.farmInfo.totalPalms = getTotalPalmsCount();
      saveStateToStorage();
      closeModal();
      renderCurrentModule();
      updateGlobalSummaryBadges();
    }

      const id = document.getElementById('op_id').value || `op-${Date.now()}`;
      const record = {
        id,
        type: document.getElementById('op_type').value,
        variety: document.getElementById('op_variety').value.trim() || 'جميع الأصناف',
        date: document.getElementById('op_date').value,
        status: document.getElementById('op_status').value,
        costOrNotes: document.getElementById('op_notes').value.trim()
      };

      const idx = state.data.operations.findIndex(o => o.id === id);
      if (idx >= 0) {
        state.data.operations[idx] = record;
        showToast('تم تحديث العملية الزراعية');
      } else {
        state.data.operations.unshift(record);
        showToast('تمت إضافة العملية الزراعية');
      }

      saveStateToStorage();
      closeModal();
      renderCurrentModule();
    }

    function deleteOperation(id) {
      state.data.operations = state.data.operations.filter(o => o.id !== id);
      saveStateToStorage();
      renderCurrentModule();
      showToast('تم حذف العملية الزراعية', 'warning');
    }

    // =========================================================================
    // 11. القسم السادس: التقارير، صافي الربح، الطباعة والنسخ الاحتياطي
    // =========================================================================
    function renderReportsModule(container) {
      const totalRevenues = getTotalSalesRevenue();
      const totalCollected = getTotalSalesCollected();
      const directExpenses = getTotalDirectExpenses();
      const salariesTotal = getTotalWorkersNetSalaries();
      const totalExpenses = directExpenses + salariesTotal;
      const netProfit = totalRevenues - totalExpenses;
      const totalDebts = getTotalClientDebts();
      const totalPalms = getTotalPalmsCount();
      const totalYield = getTotalYieldKg();

      // تفصيل المصروفات حسب الفئة + الرواتب
      const expenseBreakdown = [
        ...EXPENSE_CATEGORIES.map(cat => ({
          label: cat,
          amount: state.data.expenses.filter(e => e.category === cat).reduce((s, e) => s + (Number(e.amount) || 0), 0)
        })),
        {
          label: 'رواتب العمال (الصافي)',
          amount: salariesTotal
        }
      ].sort((a, b) => b.amount - a.amount);

      const maxExp = Math.max(...expenseBreakdown.map(x => x.amount), 1);

      // تفصيل المبيعات حسب نوع التمر
      const salesByVariety = DATE_VARIETIES.map(v => {
        const items = state.data.sales.filter(s => s.variety === v);
        return {
          variety: v,
          qty: items.reduce((sum, s) => sum + (Number(s.quantity) || 0), 0),
          revenue: items.reduce((sum, s) => sum + getSaleInvoiceTotal(s), 0)
        };
      }).sort((a, b) => b.revenue - a.revenue);

      const maxRev = Math.max(...salesByVariety.map(x => x.revenue), 1);

      container.innerHTML = `
        <!-- رأس التقارير وأزرار الطباعة والنسخ الاحتياطي -->
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 bg-white p-4 sm:p-5 rounded-2xl border border-stone-200/80 shadow-sm print-card">
          <div>
            <h2 class="text-xl font-extrabold text-palm-950">6. التقارير المالية والتشغيلية</h2>
            <p class="text-xs sm:text-sm text-stone-500 mt-0.5">إجمالي الإيرادات، المصروفات، صافي ربح المزرعة، والنسخ الاحتياطي</p>
          </div>
          <div class="no-print flex flex-wrap items-center gap-2">
            <button onclick="window.print()" class="inline-flex items-center gap-1.5 px-3.5 py-2.5 rounded-xl bg-palm-700 hover:bg-palm-800 text-white text-xs sm:text-sm font-bold cursor-pointer">
              <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
              <span>طباعة التقرير</span>
            </button>
            <button onclick="exportBackupJSON()" class="inline-flex items-center gap-1.5 px-3.5 py-2.5 rounded-xl bg-sand-100 hover:bg-sand-200 text-sand-900 border border-sand-300 text-xs sm:text-sm font-bold cursor-pointer">
              <span>تصدير JSON</span>
            </button>
            <button onclick="document.getElementById('importJsonInput').click()" class="inline-flex items-center gap-1.5 px-3.5 py-2.5 rounded-xl bg-stone-100 hover:bg-stone-200 text-stone-800 border border-stone-300 text-xs sm:text-sm font-bold cursor-pointer">
              <span>استيراد JSON</span>
            </button>
          </div>
        </div>

        <!-- بطاقات الأرباح الرئيسية -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3.5 sm:gap-4">
          <div class="bg-white p-4 sm:p-5 rounded-2xl border border-stone-200/80 shadow-sm print-card">
            <div class="text-xs font-bold text-stone-500">إجمالي الإيرادات (المبيعات)</div>
            <div class="text-2xl font-extrabold text-palm-800 mt-1">${formatMoney(totalRevenues)}</div>
            <div class="text-[11px] text-emerald-700 font-semibold mt-1">المحصّل فعلياً: ${formatMoney(totalCollected)}</div>
          </div>

          <div class="bg-white p-4 sm:p-5 rounded-2xl border border-stone-200/80 shadow-sm print-card">
            <div class="text-xs font-bold text-stone-500">إجمالي المصروفات والرواتب</div>
            <div class="text-2xl font-extrabold text-rose-700 mt-1">${formatMoney(totalExpenses)}</div>
            <div class="text-[11px] text-stone-400 mt-1">تشغيلي ${formatMoney(directExpenses)} + رواتب ${formatMoney(salariesTotal)}</div>
          </div>

          <div class="p-4 sm:p-5 rounded-2xl shadow-sm text-white print-card ${netProfit >= 0 ? 'bg-gradient-to-br from-palm-700 to-palm-900' : 'bg-gradient-to-br from-rose-700 to-rose-900'}">
            <div class="text-xs font-bold opacity-90">صافي ربح / خسارة المزرعة</div>
            <div class="text-2xl font-extrabold mt-1">${formatMoney(netProfit)}</div>
            <div class="text-[11px] opacity-85 mt-1">${netProfit >= 0 ? 'المزرعة تحقق فائضاً ربحياً' : 'المصروفات أعلى من الإيرادات'}</div>
          </div>

          <div class="bg-white p-4 sm:p-5 rounded-2xl border border-stone-200/80 shadow-sm print-card">
            <div class="text-xs font-bold text-stone-500">مديونيات العملاء المتبقية</div>
            <div class="text-2xl font-extrabold text-amber-700 mt-1">${formatMoney(totalDebts)}</div>
            <div class="text-[11px] text-stone-400 mt-1">إجمالي النخيل: ${formatNumber(totalPalms)} • الإنتاج: ${formatNumber(totalYield)} كجم</div>
          </div>
        </div>

        <!-- تفصيل المصروفات والإيرادات -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
          <div class="bg-white p-5 rounded-2xl border border-stone-200/80 shadow-sm space-y-3.5 print-card">
            <h3 class="text-base font-extrabold text-palm-950">تحليل المصروفات حسب البند</h3>
            <div class="space-y-3">
              ${expenseBreakdown.map(item => {
                const pct = Math.round((item.amount / maxExp) * 100);
                return `
                  <div>
                    <div class="flex items-center justify-between text-xs font-bold mb-1">
                      <span class="text-stone-700">${escapeHtml(item.label)}</span>
                      <span class="text-rose-700">${formatMoney(item.amount)}</span>
                    </div>
                    <div class="w-full h-2.5 rounded-full bg-stone-100 overflow-hidden">
                      <div class="h-full rounded-full bg-rose-500/85" style="width: ${pct}%"></div>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>

          <div class="bg-white p-5 rounded-2xl border border-stone-200/80 shadow-sm space-y-3.5 print-card">
            <h3 class="text-base font-extrabold text-palm-950">تحليل المبيعات حسب صنف التمر</h3>
            <div class="space-y-3">
              ${salesByVariety.map(item => {
                const pct = Math.round((item.revenue / maxRev) * 100);
                return `
                  <div>
                    <div class="flex items-center justify-between text-xs font-bold mb-1">
                      <span class="text-stone-700">تمر ${escapeHtml(item.variety)} (${formatNumber(item.qty)} كجم)</span>
                      <span class="text-palm-800">${formatMoney(item.revenue)}</span>
                    </div>
                    <div class="w-full h-2.5 rounded-full bg-stone-100 overflow-hidden">
                      <div class="h-full rounded-full bg-palm-600" style="width: ${pct}%"></div>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        </div>

        <!-- إدارة البيانات والنسخ الاحتياطي -->
        <div class="no-print bg-sand-50 p-4 sm:p-5 rounded-2xl border border-sand-200 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
          <div>
            <h4 class="text-sm font-extrabold text-sand-900">إدارة البيانات والنسخ الاحتياطي المحلي</h4>
            <p class="text-xs text-stone-600 mt-0.5">جميع البيانات محفوظة تلقائياً في متصفحك (localStorage). يمكنك حفظ ملف JSON أو استعادة البيانات الافتراضية.</p>
          </div>
          <button onclick="resetDemoData()" class="px-3.5 py-2 rounded-xl text-xs font-bold bg-white hover:bg-rose-50 text-rose-700 border border-rose-200 cursor-pointer shrink-0">
            استعادة البيانات التجريبية
          </button>
        </div>
      `;
    }

    // =========================================================================
    // 12. إعدادات المزرعة والنسخ الاحتياطي JSON والبحث
    // =========================================================================
    function handleSearchInput(val) {
      state.searchQuery = val;
      renderCurrentModule();
    }

    function setSecondaryFilter(filterVal) {
      state.secondaryFilter = filterVal;
      renderCurrentModule();
    }

    function openFarmSettingsModal() {
      const info = state.data.farmInfo;
      openModal('إعدادات المزرعة والبيانات', `
        <form onsubmit="saveFarmSettingsForm(event)" class="space-y-4">
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
            <div>
              <label class="block text-xs font-bold text-stone-700 mb-1">اسم المزرعة *</label>
              <input type="text" id="f_name" required value="${escapeHtml(info.name)}"
                class="w-full px-3.5 py-2.5 rounded-xl border border-stone-300 focus:border-palm-500 focus:outline-none text-sm" />
            </div>
            <div>
              <label class="block text-xs font-bold text-stone-700 mb-1">اسم المالك / المدير</label>
              <input type="text" id="f_owner" value="${escapeHtml(info.owner || '')}"
                class="w-full px-3.5 py-2.5 rounded-xl border border-stone-300 focus:border-palm-500 focus:outline-none text-sm" />
            </div>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
            <div>
              <label class="block text-xs font-bold text-stone-700 mb-1">الموقع / المنطقة</label>
              <input type="text" id="f_location" value="${escapeHtml(info.location || '')}"
                class="w-full px-3.5 py-2.5 rounded-xl border border-stone-300 focus:border-palm-500 focus:outline-none text-sm" />
            </div>
            <div>
              <label class="block text-xs font-bold text-stone-700 mb-1">رمز العملة</label>
              <input type="text" id="f_currency" value="${escapeHtml(info.currency || 'ج.م')}" placeholder="ج.م / ر.س / د.إ"
                class="w-full px-3.5 py-2.5 rounded-xl border border-stone-300 focus:border-palm-500 focus:outline-none text-sm" />
            </div>
          </div>

          <div>
            <label class="block text-xs font-bold text-stone-700 mb-1">ملاحظات عامة عن المزرعة</label>
            <textarea id="f_notes" rows="2" class="w-full px-3.5 py-2.5 rounded-xl border border-stone-300 focus:border-palm-500 focus:outline-none text-sm">${escapeHtml(info.notes || '')}</textarea>
          </div>

          <div class="p-3.5 rounded-xl bg-stone-50 border border-stone-200 flex flex-wrap items-center justify-between gap-2">
            <span class="text-xs font-bold text-stone-700">نسخ احتياطي واستعادة:</span>
            <div class="flex items-center gap-2">
              <button type="button" onclick="exportBackupJSON()" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-palm-600 text-white hover:bg-palm-700 cursor-pointer">تصدير JSON</button>
              <button type="button" onclick="document.getElementById('importJsonInput').click()" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-sand-100 text-sand-900 border border-sand-300 hover:bg-sand-200 cursor-pointer">استيراد JSON</button>
            </div>
          </div>

          <div class="flex items-center justify-end gap-2 pt-2">
            <button type="button" onclick="closeModal()" class="px-4 py-2.5 rounded-xl text-sm font-bold bg-stone-100 hover:bg-stone-200 text-stone-700 cursor-pointer">إلغاء</button>
            <button type="submit" class="px-5 py-2.5 rounded-xl text-sm font-bold bg-palm-600 hover:bg-palm-700 text-white cursor-pointer">حفظ الإعدادات</button>
          </div>
        </form>
      `);
    }

    function saveFarmSettingsForm(e) {
      e.preventDefault();
      state.data.farmInfo = {
        ...state.data.farmInfo,
        name: document.getElementById('f_name').value.trim() || 'مزرعة النخيل',
        owner: document.getElementById('f_owner').value.trim(),
        location: document.getElementById('f_location').value.trim(),
        currency: document.getElementById('f_currency').value.trim() || 'ج.م',
        notes: document.getElementById('f_notes').value.trim()
      };
      saveStateToStorage();
      closeModal();
      updateGlobalSummaryBadges();
      renderCurrentModule();
      showToast('تم حفظ إعدادات المزرعة');
    }

    function exportBackupJSON() {
      try {
        const payload = {
          exportedAt: new Date().toISOString(),
          app: 'إدارة المزرعة الشاملة',
          data: state.data
        };
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        const dateStamp = new Date().toISOString().split('T')[0];
        a.href = url;
        a.download = `palm-farm-backup-${dateStamp}.json`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
        showToast('تم تحميل ملف النسخة الاحتياطية JSON');
      } catch (err) {
        console.error(err);
        showToast('حدث خطأ أثناء تصدير النسخة الاحتياطية', 'error');
      }
    }

    function handleImportJSON(event) {
      const file = event.target.files?.[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const parsed = JSON.parse(e.target.result);
          const importedData = parsed.data || parsed;
          if (!importedData || typeof importedData !== 'object') {
            throw new Error('صيغة ملف غير صالحة');
          }

          const defaults = createInitialData();
          state.data = {
            farmInfo: { ...defaults.farmInfo, ...(importedData.farmInfo || {}) },
            workers: Array.isArray(importedData.workers) ? importedData.workers : [],
            expenses: Array.isArray(importedData.expenses) ? importedData.expenses : [],
            clients: Array.isArray(importedData.clients) ? importedData.clients : [],
            sales: Array.isArray(importedData.sales) ? importedData.sales : [],
            varieties: Array.isArray(importedData.varieties) ? importedData.varieties : [],
            operations: Array.isArray(importedData.operations) ? importedData.operations : []
          };

          saveStateToStorage();
          updateGlobalSummaryBadges();
          renderCurrentModule();
          showToast('تم استيراد النسخة الاحتياطية بنجاح');
        } catch (err) {
          console.error(err);
          showToast('تعذر قراءة ملف JSON، تأكد من صحة الملف', 'error');
        } finally {
          event.target.value = '';
        }
      };
      reader.readAsText(file);
    }

    function resetDemoData() {
      state.data = createInitialData();
      saveStateToStorage();
      updateGlobalSummaryBadges();
      renderCurrentModule();
      showToast('تمت استعادة البيانات التجريبية الافتراضية');
    }

    // =========================================================================
    // 13. تهيئة التطبيق عند التحميل
    // =========================================================================
    window.addEventListener('DOMContentLoaded', () => {
      loadStateFromStorage();
      renderNavigation();
      updateGlobalSummaryBadges();
      renderCurrentModule();
    });
  </script>
</body>
